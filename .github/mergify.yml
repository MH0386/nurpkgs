# queue rule 'Nix Flake': `allow_queue_branch_edit` was turned off. It now requires `merge_method: merge-batch` or `merge_method: fast-forward`.
extends: MH0386
queue_rules:
  - name: Nix Flake
    allow_queue_branch_edit: false
    queue_conditions:
      - author = renovate[bot]
      - files ~= ^(flake.lock|devenv.lock)$
    merge_conditions:
      - deployment-success = test
merge_protections_settings:
  auto_merge_conditions: true
  reporting_method: check-runs
